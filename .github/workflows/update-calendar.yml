name: Update World Cup Calendar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate calendar
        run: python scripts/update_calendar.py

      - name: Commit updated calendar
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update World Cup 2026 calendar"
          file_pattern: docs/worldcup-2026*.ics data/fifa-worldcup-2026*.json
