<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup 2026 Calendar</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7f8;
        color: #172026;
      }

      main {
        width: min(680px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        font-size: 18px;
        line-height: 1.5;
        color: #52616b;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        background: #0b6bcb;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      code {
        display: block;
        margin-top: 18px;
        padding: 14px;
        border: 1px solid #d6dee4;
        border-radius: 8px;
        overflow-wrap: anywhere;
        background: white;
        color: #172026;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101418;
          color: #edf2f5;
        }

        p {
          color: #aebbc4;
        }

        code {
          background: #171d22;
          border-color: #303941;
          color: #edf2f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>World Cup 2026 Calendar</h1>
      <p>Auto-updated from FIFA fixture data. Events show matchup, kickoff time in your local timezone, and stadium location.</p>
      <a href="webcal://raw.githubusercontent.com/Jason-lewis-526/Worldcup-Calendar/main/docs/worldcup-2026.ics">Subscribe in Apple Calendar</a>
      <code>https://raw.githubusercontent.com/Jason-lewis-526/Worldcup-Calendar/main/docs/worldcup-2026.ics</code>
    </main>
  </body>
</html>
